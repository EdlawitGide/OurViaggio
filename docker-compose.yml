
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: trips
      POSTGRES_PASSWORD: trips
      POSTGRES_DB: trips
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trips"]
      interval: 3s
      retries: 10

  api:
    build: ./backend
    environment:
      DATABASE_URL: "postgresql://trips:trips@db:5432/trips"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - tripphotos:/srv/uploads
    ports:
      - "8000:8000"

  web:
    build: ./frontend
    depends_on:
      - api
    ports:
      - "8080:80"

volumes:
  pgdata: {}
  tripphotos: {}
